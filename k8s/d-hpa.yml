---
apiVersion : autoscaling/v2
kind : HorizontalPodAutoscaler
metadata :
  name : d-hpa
spec :
  scaleTargetRef :
    apiVersion : apps/v1
    kind : Deployment
    name : dineout-service
  minReplicas : 3
  maxReplicas : 6
  metrics :
    - type : Resource
      resource :
        name : cpu
        target :
          type : Utilization
          averageUtilization : 60
